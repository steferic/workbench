# Does it still compile where nobody develops?
#
# Deliberately not a test suite and deliberately not a PR gate. The whole
# failure this exists for was a Unix-only import landing in a cross-platform
# crate: `cargo test` on a Mac cannot see it, and four pushes went out broken.
# A type-check on the two platforms nobody here builds on catches that in
# about a minute, and stays quiet otherwise.
name: Check

on:
  push:
    branches: [main]
  # So it can be run against a branch before merging, when that is wanted.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (ALSA for audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --all-targets so test code is type-checked too: a cfg mistake inside a
      # #[cfg(test)] block is exactly as good at breaking a build.
      - name: Check
        run: cargo check --all-targets
