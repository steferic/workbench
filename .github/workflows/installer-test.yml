name: Installer smoke test

# Manually-dispatched end-to-end test of the published one-line installers,
# exactly as a new user would run them. Run after cutting a release.
on:
  workflow_dispatch:

jobs:
  shell:
    name: shell installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Install ALSA runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - name: Run one-line installer
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/steferic/workbench/releases/latest/download/workbench-installer.sh | sh
      - name: Verify binary runs
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          workbench --version
          workbench list

  powershell:
    name: powershell installer (windows)
    runs-on: windows-latest
    steps:
      - name: Run one-line installer
        shell: powershell
        run: irm https://github.com/steferic/workbench/releases/latest/download/workbench-installer.ps1 | iex
      - name: Verify binary runs
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          workbench --version
          workbench list
